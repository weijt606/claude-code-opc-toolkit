<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Claude-Code OPC Toolkit">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#0e0d0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#F2A584"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="320" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Window background -->
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Title bar -->
    <rect width="1200" height="36" fill="#252320"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#3a3530" stroke-width="1"/>

    <!-- macOS traffic-light dots -->
    <circle cx="24" cy="18" r="6" fill="#FF5F57"/>
    <circle cx="48" cy="18" r="6" fill="#FEBC2E"/>
    <circle cx="72" cy="18" r="6" fill="#28C840"/>

    <!-- Title bar path -->
    <text x="600" y="22" text-anchor="middle" dominant-baseline="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace"
          font-size="13" fill="#7a7570">~/claude-code-opc-toolkit</text>

    <!-- Decorative subtle grid dots -->
    <g fill="#3a3530" opacity="0.5">
      <circle cx="100" cy="100" r="1"/>
      <circle cx="160" cy="100" r="1"/>
      <circle cx="220" cy="100" r="1"/>
      <circle cx="100" cy="160" r="1"/>
      <circle cx="160" cy="160" r="1"/>
      <circle cx="220" cy="160" r="1"/>
      <circle cx="100" cy="220" r="1"/>
      <circle cx="160" cy="220" r="1"/>
      <circle cx="220" cy="220" r="1"/>
      <circle cx="980" cy="100" r="1"/>
      <circle cx="1040" cy="100" r="1"/>
      <circle cx="1100" cy="100" r="1"/>
      <circle cx="980" cy="160" r="1"/>
      <circle cx="1040" cy="160" r="1"/>
      <circle cx="1100" cy="160" r="1"/>
      <circle cx="980" cy="220" r="1"/>
      <circle cx="1040" cy="220" r="1"/>
      <circle cx="1100" cy="220" r="1"/>
    </g>

    <!-- Main title -->
    <text x="600" y="148" text-anchor="middle" dominant-baseline="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="58" fill="#fafafa" letter-spacing="-1.5">Claude-Code <tspan fill="url(#accent)" font-weight="800">OPC</tspan> Toolkit</text>

    <!-- Tagline -->
    <text x="600" y="190" text-anchor="middle" dominant-baseline="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="17" fill="#a8a098">Productivity tools for solo full-stack AI developers</text>

    <!-- Command line preview -->
    <text x="600" y="246" text-anchor="middle" dominant-baseline="middle"
          font-family="'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', monospace"
          font-size="15" fill="#D97757"><tspan fill="#666">$</tspan> cc-status <tspan fill="#3a3530">·</tspan> cc-resume <tspan fill="#3a3530">·</tspan> cc-limits <tspan fill="#3a3530">·</tspan> cc-daily <tspan fill="#3a3530">·</tspan> cc-skill-init</text>

    <!-- Sub-tag -->
    <text x="600" y="282" text-anchor="middle" dominant-baseline="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="12" fill="#6a655f" letter-spacing="2">ONE-PERSON COMPANY · SOLO FOUNDER · SOLO BUILDER</text>
  </g>
</svg>
